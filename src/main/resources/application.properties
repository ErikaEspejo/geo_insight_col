server.port=8080

geoinsight.data-dir=data
geoinsight.datasets-dir=docs/datasets
geoinsight.admin-account-file=config/admin-account.json
geoinsight.basemap-file=basemap/colombia.geojson
geoinsight.download.max-attempts=3
